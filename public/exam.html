<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F5F3ED">
  <title>备考题库 · 地基基础检测</title>

  <!-- 独立页面：仅依赖自托管 Vue 框架（运行时编译模板需 unsafe-eval，与主应用一致）。
       不加载 Swiper——备考题库是纵向滚动，用不到；也不加载 CardFlow 的 style.css。 -->
  <link rel="stylesheet" href="./exam.css" />
  <link rel="icon" type="image/svg+xml" href="./icon.svg" />

  <script src="./vendor/vue.global.prod.js"></script>
</head>
<body>
  <!-- 备考题库应用挂载点。本页面与 CardFlow（index.html）是两套互不相干的应用，
       不共享 Vue 实例、不共享 store、不共享 CardFlow 的卡片数据。 -->
  <div id="exam-app"></div>

  <script src="./exam.js"></script>

  <!-- Service Worker：注册并监听更新。新版本就绪后自动刷新当前页，
       用户无需手动硬刷新即可看到最新 exam.js / exam.css（避免旧 SW 一直喂旧缓存）。 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          reg.addEventListener('updatefound', function () {
            var installing = reg.installing;
            if (!installing) return;
            installing.addEventListener('statechange', function () {
              // 已有旧版在控且新 SW 安装完成 → 自动刷新以应用新版本
              if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(function () { /* 注册失败不影响正常使用，下次加载重试 */ });
      });
    }
  </script>
</body>
</html>
